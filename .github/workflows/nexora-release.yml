name: Nexora release

# Builds the Windows installer: the frozen engine (private engine repo) bundled
# into the IDE, packaged with the repo's own gulp + Inno Setup tasks, and
# published as a GitHub Release; nexora.visionscraft.tech/download offers the newest one.
#
# Run it by pushing a tag (git tag v1.0.0 && git push origin v1.0.0) or from
# the Actions tab. Needs the repository secret ENGINE_DEPLOY_KEY: a read-only
# deploy key of the engine repository (nexora-platform/infra/setup-github-ci.sh).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      engine_ref:
        description: Engine branch or tag to bundle
        default: ide-benchmarking

permissions:
  contents: write

jobs:
  windows:
    # Pinned: windows-latest now ships Visual Studio 2026, which node-gyp cannot
    # find, so native modules such as @parcel/watcher fail to build.
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      # Electron and built-in extension downloads go through the GitHub API; unauthenticated calls are rate limited.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        # Stop a step at its first failing command; plain pwsh carries on after a failed npm or gulp.
        shell: pwsh -NoProfile -Command "$PSNativeCommandUseErrorActionPreference = $true; $ErrorActionPreference = 'Stop'; . '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          path: Nexora

      # Beside the IDE, where the packaging tasks look for backend/dist/engine.
      - uses: actions/checkout@v4
        with:
          repository: Atif1299/Nexora-IDE-Backend-Architecture
          ref: ${{ github.ref_type == 'tag' && github.ref_name || inputs.engine_ref }}
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          path: Nexora-IDE-Backend-Architecture

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Nexora-IDE-Backend-Architecture/backend/requirements.txt

      - name: Freeze the engine
        working-directory: Nexora-IDE-Backend-Architecture/backend
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -q -r requirements.txt
          .\packaging\build_engine.ps1
          .venv\Scripts\python packaging\smoke_engine.py

      - uses: actions/setup-node@v4
        with:
          node-version-file: Nexora/.nvmrc
          cache: npm
          cache-dependency-path: Nexora/package-lock.json

      - name: Install IDE dependencies
        working-directory: Nexora
        # node-gyp otherwise picks the newest Python on the runner, not the one set up above.
        env:
          npm_config_python: ${{ steps.python.outputs.python-path }}
        run: npm ci

      # Packaging ships the extension's out/ as it is; out/ is not in git.
      - name: Compile the Nexora extension
        working-directory: Nexora/extensions/nexora-core
        run: |
          npm ci
          npm run compile

      - name: Build the IDE and the installer
        working-directory: Nexora
        run: |
          npm run gulp -- vscode-win32-x64-min
          npm run gulp -- vscode-win32-x64-inno-updater
          npm run gulp -- vscode-win32-x64-user-setup
          # The packaging tasks only warn when the engine is missing; an installer without it is useless.
          if (-not (Test-Path ..\VSCode-win32-x64\engine\nexora-engine.exe)) { throw 'The engine is not in the packaged app' }

      # The update feed answers from this, so it never has to guess what was built.
      # The client checks the sha256 before installing, so a wrong one here means
      # every installed Nexora refuses the update.
      - name: Write the update manifest
        working-directory: Nexora
        run: |
          $setup = Get-ChildItem .build\win32-x64\user-setup\*.exe | Select-Object -First 1
          $sha = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          # Same tag the release step uses, so the download URL it writes resolves.
          $tag = '${{ github.ref_type == ''tag'' && github.ref_name || format(''build-{0}'', github.run_number) }}'
          $manifest = [ordered]@{
            version        = '${{ github.sha }}'
            productVersion = $tag.TrimStart('v')
            name           = "Nexora $tag"
            url            = "https://github.com/${{ github.repository }}/releases/download/$tag/$($setup.Name)"
            sha256hash     = $sha
            timestamp      = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
            supportsFastUpdate = $true
          }
          $out = Join-Path $setup.DirectoryName 'nexora-update-win32-x64-user.json'
          # Written through .NET with a BOM-less encoder on purpose: Set-Content -Encoding utf8
          # emits a BOM on Windows PowerShell, and JSON.parse in the update feed throws on it,
          # which would make every update check answer "nothing to do" and never say why.
          $json = $manifest | ConvertTo-Json
          [System.IO.File]::WriteAllText($out, $json, (New-Object System.Text.UTF8Encoding $false))
          Write-Host "Update manifest: $out"
          Get-Content $out
          # The feed cannot read a manifest the build could not parse itself.
          $null = Get-Content $out -Raw | ConvertFrom-Json
          if ((Get-Content $out -AsByteStream -TotalCount 3) -join ',' -eq '239,187,191') { throw 'Manifest was written with a BOM' }

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          # A manual run is a test build: kept as a draft. A tag is a release.
          draft: ${{ github.ref_type != 'tag' }}
          make_latest: ${{ github.ref_type == 'tag' }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: Nexora ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          files: |
            Nexora/.build/win32-x64/user-setup/*.exe
            Nexora/.build/win32-x64/user-setup/nexora-update-win32-x64-user.json
          fail_on_unmatched_files: true
